# Settings for the shade model. Every dimension and setting lives here, each with a
# "source" note saying where the number comes from. Heights are metres above the field.
# Edit this file, not the code, to change a scenario or a dimension.

site:
  latitude:
    value: 35.167873
    source: "Home plate (HOME) digitised from satellite imagery, data/stadium.geojson"
  longitude:
    value: 126.888657
    source: "Home plate (HOME) digitised from satellite imagery, data/stadium.geojson"
  altitude_m:
    value: 30.0
    source: "Approximate site elevation in Gwangju; the effect on sun angles is negligible"
  timezone:
    value: "Asia/Seoul"
    source: "Korea Standard Time (UTC+9, no daylight saving)"

time_window:
  start:
    value: "14:00"
    source: "KBO Sunday day games start at 14:00"
  end:
    value: "17:00"
    source: "Project plan: three-hour game window; each step covers [t, t + step)"
  step_min:
    value: 5
    source: "Project plan; checked against 10-minute steps under resolution_checks"

# Scenario dates: all Sundays with a 14:00 start.
scenarios:
  - key: Apr
    date: "2026-04-19"
    label: "19 Apr"
    source: "Spring case: Sunday in the 2026 season"
  - key: May
    date: "2026-05-24"
    label: "24 May"
    source: "Summer case: Sunday in the 2026 season. Replaces July because KBO plays no 14:00 games in July"
  - key: Sep
    date: "2026-09-20"
    label: "20 Sep"
    source: "Autumn case: Sunday in the 2026 season"

# Original settings of the first model. Used only by the regression test, which
# compares the model with tests/reference/exposure.csv, and by the worked example.
regression_dates:
  - key: Apr
    date: "2026-04-15"
    label: "15 Apr"
    source: "First model run (reference results in tests/reference/exposure.csv)"
  - key: Jul
    date: "2026-07-15"
    label: "15 Jul"
    source: "First model run; hypothetical, no 14:00 games are played in July"
  - key: Oct
    date: "2026-10-15"
    label: "15 Oct"
    source: "First model run (reference results in tests/reference/exposure.csv)"

geometry:
  stadium_file:
    value: "data/stadium.geojson"
    source: "Points and polygons digitised from satellite imagery (geojson.io); see README, data provenance"
  roof_height_m:
    value: 22.5
    source: "Underside of the roof front edge. Building register gives 20 m above ground; row arithmetic and photo proportions give 22-23 m above the field"
  head_height_m:
    value: 1.2
    source: "Project plan: head height of a seated spectator above the seat surface"
  foul_margin_m:
    value: 4.0
    source: "Stand front wall is at least 4 m outside the foul line (satellite imagery)"
  mound_distance_m:
    value: 18.4
    source: "Regulation pitching distance (60 ft 6 in = 18.44 m). Used only as a reference point on the field to find the field-side edge of each roof"
  # Roof polygons in order from the first-base end, behind home plate, to the third-base end,
  # with the stand profile that sits in front of each roof.
  roof_chain:
    value:
      - {roof: ROOF_1B, profile: "1B"}
      - {roof: ROOF_HOME, profile: "HOME"}
      - {roof: ROOF_3B, profile: "3B"}
    source: "Roof footprints digitised from satellite imagery; roof edge read where seats disappear under the roof"

# Stand cross-sections: (d, z) pairs, d = distance from the roof's field-side edge towards
# the field, z = height above the field. Every profile has the same seven points:
#   A upper deck back / B upper deck front / C foot of the upper deck front wall /
#   D end of the concourse = back of the lower bowl / E lower bowl row 1 /
#   F top of the field wall / G foot of the field wall
stand_profiles:
  "3B":
    value: [[0.0, 20.0], [12.3, 14.7], [12.3, 9.86], [20.2, 9.86], [47.3, 1.61], [48.5, 1.2], [48.5, 0.0]]
    source: "Upper deck (section 529): 15 rows x 0.35 m risers, front at 14.7 m from photo proportions. Lower bowl (section 122): 34 rows, 0.41 m + 33 x 0.25 m risers above a 1.2 m field wall. Depths from satellite imagery; riser values from seat-view listings (to be re-checked on the source pages)"
  "HOME":
    value: [[0.0, 9.96], [0.0, 9.96], [0.0, 9.96], [5.2, 9.96], [22.3, 3.95], [31.3, 1.2], [31.3, 0.0]]
    source: "Concourse, then the centre table seats (12 rows: 0.40 m + 11 x 0.51 m risers, 6.0 m rise over 17 m), then the front seats down to a 1.2 m field wall. Depths from satellite imagery; riser values from seat-view listings"
  "1B":
    value: [[0.0, 9.69], [0.0, 9.69], [0.0, 9.69], [0.0, 9.69], [26.5, 1.61], [27.0, 1.2], [27.0, 0.0]]
    source: "Lower bowl (section 105): 34 rows x 0.25 m risers, reaching the roof edge; the upper deck is hidden under the roof. Depths from satellite imagery; riser values from seat-view listings"

sampling:
  grid_n:
    value: 3
    source: "Project plan: 3 x 3 sample points per section, each at the centre of its grid cell; checked against a 5 x 5 grid under resolution_checks"

# Sensitivity variants. vscale multiplies every height (stands and roof); overhang moves the
# roof's field-side edge towards the field by this fraction of the roof width; orient_deg
# turns the stadium clockwise.
variants:
  - {name: "base", vscale: 1.0, overhang: 0.0, orient_deg: 0.0,
     source: "Base case"}
  - {name: "height -10%", vscale: 0.9, overhang: 0.0, orient_deg: 0.0,
     source: "Project plan: vertical scale -10 %. Covers the 20 m (register) vs 22.5 m (rows and photos) conflict"}
  - {name: "height +10%", vscale: 1.1, overhang: 0.0, orient_deg: 0.0,
     source: "Project plan: vertical scale +10 %"}
  - {name: "overhang -10%", vscale: 1.0, overhang: -0.10, orient_deg: 0.0,
     source: "Project plan: roof overhang -10 % of roof width (1.3-2.0 m), the uncertainty of reading the roof edge from satellite imagery"}
  - {name: "overhang +10%", vscale: 1.0, overhang: 0.10, orient_deg: 0.0,
     source: "Project plan: roof overhang +10 % of roof width"}
  - {name: "orient -2°", vscale: 1.0, overhang: 0.0, orient_deg: -2.0,
     source: "Project plan: orientation -2 degrees, the digitising uncertainty of the home-to-centre-field bearing"}
  - {name: "orient +2°", vscale: 1.0, overhang: 0.0, orient_deg: 2.0,
     source: "Project plan: orientation +2 degrees"}

resolution_checks:
  step_min:
    value: 10
    source: "Coarser time step, to show the results do not depend on the 5-minute step"
  grid_n:
    value: 5
    source: "Finer sampling grid (5 x 5 = 25 points per section), to show the results do not depend on the 3 x 3 grid"

# Names shown in tables and figures. A section without an entry is shown under its polygon name.
section_labels:
  value:
    SEC_3B_UPPER: "529 (3B upper)"
    SEC_122: "122 (3B lower)"
    SEC_TABLE_CENTER: "Table centre (home)"
    SEC_105: "105 (1B lower)"
  source: "Section numbers from the stadium seating map"

# Checks of the digitised points against published distances from home plate.
scale_checks:
  distances_m:
    value: {LF_POLE: 99.0, RF_POLE: 99.0, CF: 121.0, "2B": 38.8, STAND_FRONT: 18.0}
    source: "Foul poles 99 m and centre field 121 m: KIA Tigers stadium information. Second base 38.8 m: regulation. Home plate to stands 18 m: 2014 opening press reports (unofficial)"
  distance_tolerance_pct:
    value: 2.0
    source: "Project plan: accepted scale error of the satellite digitising"
  foul_angle_tolerance_deg:
    value: 1.5
    source: "Project plan: accepted error of the 90-degree angle between the foul lines"

validation:
  labels_file:
    value: "data/labels.csv"
    source: "Labelled broadcast frames; copy data/labels_template.csv and fill it in"
  # A date may appear in one list only. Dates in neither list stop the run.
  calibration_dates:
    value: []
    source: "Dates used while adjusting the model; fill in when labels exist"
  test_dates:
    value: []
    source: "Held-out dates, looked at only after the model is fixed; fill in when labels exist"
  use_single_labelled:
    value: false
    source: "Only labels on which both labellers agree enter the confusion matrices"

worked_example:
  section:
    value: SEC_3B_UPPER
    source: "Section 529; the same example that was presented at the check-in"
  point:
    value: 5
    source: "Middle point of the 3 x 3 grid"
  cases:
    value:
      - {date: "2026-10-15", label: "15 Oct", sunny: "15:00", shaded: "16:30"}
      - {date: "2026-09-20", label: "20 Sep", sunny: "15:00", shaded: "16:30"}
    source: "15 Oct: values presented at the check-in. 20 Sep: the same point on a scenario date"

figures:
  series_order:
    value: [SEC_TABLE_CENTER, SEC_105, SEC_3B_UPPER, SEC_122]
    source: "Fixed colour order of the sections in every figure; a new section takes the next colour"
  map_scenario:
    value: Sep
    source: "Scenario shown in the plan-view shade map and the cross-section"
  map_times:
    value: ["14:00", "15:00", "16:00", "16:30"]
    source: "Four moments across the game window"
  cross_section_times:
    value: ["15:00", "16:00", "16:30"]
    source: "Sun rays drawn in the cross-section figure"
